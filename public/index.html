<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Gerenciador de Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="noise"></div>

  <header>
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span>TaskFlow</span>
    </div>
    
    <!-- Botão de logout — leva para a rota /logout -->
    <a href="/logout" style="
      background: #e74c3c;
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-family: Arial, sans-serif;
    ">Sair</a>

  </header>

  <main>
    <section class="hero">
      <h1>Suas tarefas,<br /><em>organizadas.</em></h1>
      <p class="subtitle">Persistência real com MongoDB. Arquitetura MVC profissional.</p>
    </section>

    <div class="layout">

      <!-- Formulário de criação -->
      <aside class="form-panel">
        <h2 class="panel-title">Nova Tarefa</h2>
        <div class="form-group">
          <label for="titulo">Título <span class="required">*</span></label>
          <input type="text" id="titulo" placeholder="Ex: Estudar Mongoose..." />
        </div>
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" rows="3" placeholder="Detalhes opcionais..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
              <option value="baixa">🟢 Baixa</option>
              <option value="media" selected>🟡 Média</option>
              <option value="alta">🔴 Alta</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" onclick="criarTarefa()">
          <span>＋</span> Criar Tarefa
        </button>

        <div class="api-info">
          <p class="api-label">Endpoint</p>
          <code>POST /api/tarefas</code>
        </div>
      </aside>

      <!-- Lista de tarefas -->
      <section class="tasks-panel">
        <div class="tasks-header">
          <h2 class="panel-title">Tarefas</h2>
          <div class="filter-tabs">
            <button class="tab active" onclick="filtrar('todas', this)">Todas</button>
            <button class="tab" onclick="filtrar('pendente', this)">Pendentes</button>
            <button class="tab" onclick="filtrar('em_andamento', this)">Em andamento</button>
            <button class="tab" onclick="filtrar('concluida', this)">Concluídas</button>
          </div>
        </div>

        <div id="loading" class="loading">
          <div class="spinner"></div>
          <span>Conectando ao MongoDB...</span>
        </div>

        <div id="lista-tarefas" class="task-list"></div>

        <div id="empty-state" class="empty-state" style="display:none">
          <span class="empty-icon">◎</span>
          <p>Nenhuma tarefa encontrada</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal de edição -->
  <div id="modal" class="modal-overlay" style="display:none" onclick="fecharModal(event)">
    <div class="modal">
      <div class="modal-header">
        <h3>Editar Tarefa</h3>
        <button class="modal-close" onclick="document.getElementById('modal').style.display='none'">✕</button>
      </div>
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="edit-titulo" />
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <textarea id="edit-descricao" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="edit-status">
            <option value="pendente">Pendente</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prioridade</label>
          <select id="edit-prioridade">
            <option value="baixa">🟢 Baixa</option>
            <option value="media">🟡 Média</option>
            <option value="alta">🔴 Alta</option>
          </select>
        </div>
      </div>
      <input type="hidden" id="edit-id" />
      <div class="modal-footer">
        <button class="btn-ghost" onclick="document.getElementById('modal').style.display='none'">Cancelar</button>
        <button class="btn-primary" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Toast de notificação -->
  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
